name: Feature
description: Something Sparky should be able to do
labels: [feature]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task, not the implementation.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: The phase sub-issue of #79 this belongs to, if you know it.
