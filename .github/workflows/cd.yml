name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Rebuilds an image when its inputs changed; workflow_dispatch rebuilds all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/cd.yml
            rust:
              - *shared
              - apps/engine/**
              - apps/discord/**
              - Cargo.toml
              - Cargo.lock
              - deploy/docker/rust.Dockerfile
            sandbox:
              - *shared
              - deploy/docker/sandbox.Dockerfile
            sandbox-proxy:
              - *shared
              - deploy/docker/sandbox-proxy.Dockerfile
              - deploy/sandbox/**
            runpod:
              - *shared
              - apps/engine/**
              - apps/discord/**
              - Cargo.toml
              - Cargo.lock
              - sparky.toml
              - deploy/docker/runpod.Dockerfile
              - deploy/runpod/**
              - deploy/wasm/**
      - id: images
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          RUST: ${{ steps.filter.outputs.rust }}
          SANDBOX: ${{ steps.filter.outputs.sandbox }}
          SANDBOX_PROXY: ${{ steps.filter.outputs.sandbox-proxy }}
          RUNPOD: ${{ steps.filter.outputs.runpod }}
        run: |
          list=()
          { [ "$ALL" = true ] || [ "$RUST" = true ]; } && list+=(rust)
          { [ "$ALL" = true ] || [ "$SANDBOX" = true ]; } && list+=(sandbox)
          { [ "$ALL" = true ] || [ "$SANDBOX_PROXY" = true ]; } && list+=(sandbox-proxy)
          { [ "$ALL" = true ] || [ "$RUNPOD" = true ]; } && list+=(runpod)
          echo "list=$(printf '%s\n' "${list[@]}" | jq -Rc 'select(length>0)' | jq -sc .)" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.name }}.Dockerfile
          push: true
          tags: |
            ghcr.io/theaisocietyasu/sparkyai-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/theaisocietyasu/sparkyai-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
